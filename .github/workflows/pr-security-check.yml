name: pr-security-check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run risk mapper
        run: ./scripts/run_risk_mapper.sh

      - name: Start hardened app
        env:
          APP_MODE: hardened
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > pr-app.log 2>&1 &
          sleep 3

      - name: Run AI attack simulation
        run: ./scripts/run_attack_simulation.sh

      - name: Enforce final gate
        run: ./scripts/generate_report.sh
