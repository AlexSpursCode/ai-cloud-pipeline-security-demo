[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cloud-pipeline-security-demo"
version = "0.1.0"
description = "SANS demo for securing AI workloads in CI/CD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
